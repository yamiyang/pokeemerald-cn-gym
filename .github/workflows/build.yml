name: Build ROM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GAME_VERSION: EMERALD
  GAME_REVISION: 0
  COMPARE: 0
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 build-essential git

      - name: Cache host tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'tools/*/Makefile') }}

      - name: Build
        run: make -j$(nproc) -O all

      - name: Verify ROM
        run: |
          ls -l pokeemerald.gba
          test -s pokeemerald.gba
          md5sum pokeemerald.gba

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: PokeEmerald_CN_GymRemake
          path: pokeemerald.gba
          if-no-files-found: error
          retention-days: 30
